- name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Set Git identity (Essential for many '128' errors)
          git config --global user.email "wilson@example.com"
          git config --global user.name "Wilson Nilus"
          
          # 2. Force delete any existing 'hf' remote to start fresh
          git remote remove hf || true 
          
          # 3. Add the remote using your username and the CORRECT Space name
          # Replace 'YOUR_SPACE_NAME' with the actual name from your HF URL
          git remote add hf https://wilsonnilus:$HF_TOKEN@huggingface.co/spaces/wilsonnilus/YOUR_SPACE_NAME
          
          # 4. Push with force
          git push --force hf main
