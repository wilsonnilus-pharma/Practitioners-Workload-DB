name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Setup Identity
          git config --global user.email "wilson@example.com"
          git config --global user.name "Wilson Nilus"
          
          # 2. Define Variables (Update these two!)
          export HF_USERNAME="wilsonnilus"
          export HF_SPACE_NAME="Practitioners-Workload-DB"
          
          # 3. Clean and Add Remote
          git remote remove hf || true
          git remote add hf https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME
          
          # 4. Force Sync
          git push --force hf main
