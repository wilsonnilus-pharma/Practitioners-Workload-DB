name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Setup Identity
          git config --global user.email "wilsonnilus@gmail.com"
          git config --global user.name "WilsonPharma"
          
          # 2. Add Remote (Updated with correct WilsonPharma name)
          git remote remove hf || true
          git remote add hf https://WilsonPharma:$HF_TOKEN@huggingface.co/spaces/WilsonPharma/Practitioners-Workload-DB
          
          # 3. Force Push
          git push --force hf main
