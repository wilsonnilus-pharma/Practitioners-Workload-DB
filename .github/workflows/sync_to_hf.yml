name: Sync to Hugging Face
on:
  push:
    branches: [main, master] # Runs on either branch name
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "wilsonnilus@gmail.com"
          git config --global user.name "WilsonPharma"
          
          # This line pushes directly to the Space URL using your Secret
          # It will work even if your branch is 'main' or 'master'
          git push --force https://WilsonPharma:$HF_TOKEN@huggingface.co/spaces/WilsonPharma/Practitioners-Workload-DB HEAD:main
